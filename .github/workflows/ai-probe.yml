name: AI probe (debug)
on:
  push:
    branches: ['debug/ai-probe']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          USDA_FDC_DISABLED: 'true'
        run: node --experimental-strip-types scripts/debug/ai-probe.mjs 2>&1 | tee probe.txt
