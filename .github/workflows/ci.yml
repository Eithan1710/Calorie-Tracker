# Checks every branch / pull request: unit tests, typecheck + production build,
# and the Playwright end-to-end suite (mobile + desktop). Nothing is deployed.
# Failures are also reported as annotations (the tail of the failing output),
# so they are visible on the run page without opening the logs.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint (TypeScript + React hooks rules)
        run: |
          set -o pipefail
          # its own folder with TypeScript 5 (typescript-eslint's parser needs the TS 5 API; the app builds with TS 7),
          # so the app's lockfile stays as is; with -c the config's base path is the repository
          L="$RUNNER_TEMP/lint"; mkdir -p "$L"; cp eslint.config.js "$L/"
          (cd "$L" && echo '{"private":true,"type":"module"}' > package.json && npm install --no-audit --no-fund eslint@9 typescript-eslint@8 eslint-plugin-react-hooks@5 typescript@5.9) > lint.log 2>&1 || { scripts/annotate-failure.sh 'lint install' lint.log; exit 1; }
          "$L/node_modules/.bin/eslint" -c "$L/eslint.config.js" . --max-warnings=50 2>&1 | tee -a lint.log || { scripts/annotate-failure.sh 'lint' lint.log; exit 1; }
      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log || { scripts/annotate-failure.sh 'unit tests' unit.log 'FAIL|Failed Tests'; exit 1; }
          echo "::notice title=unit tests::$(sed -e 's/\x1b\[[0-9;]*m//g' unit.log | grep -E '^\s+(Test Files|Tests) ' | tr -s ' ' | tr '\n' ' ')"

      - name: Typecheck + build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { scripts/annotate-failure.sh build build.log 'error TS|error'; exit 1; }
          npm run check:pwa 2>&1 | tee pwa.log || { scripts/annotate-failure.sh pwa pwa.log; exit 1; }

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e.log || {
            scripts/annotate-failure.sh e2e e2e.log '^  [0-9]+\) '
            # page snapshots of the failing tests (ARIA tree at the moment of failure)
            for f in $(ls test-results/*/error-context.md 2>/dev/null | head -4); do head -c 6000 "$f" > ctx.log; scripts/annotate-failure.sh "snapshot $(basename $(dirname $f))" ctx.log; done
            exit 1
          }
          echo "::notice title=e2e::$(sed -e 's/\x1b\[[0-9;]*m//g' e2e.log | grep -E '^\s+[0-9]+ (passed|failed|flaky|skipped)' | tr -s ' ' | tr '\n' ' ')"

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            test-results/**/*.png
            docs/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Screenshots → ci/screenshots branch (for review)
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls docs/screenshots/*.png >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/shots && cp docs/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b ci/screenshots && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm "screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots || true

  # Food database: every curated number still matches its source record, the full
  # build passes validation, the migration applies (twice) on Postgres, and search
  # quality / access rules hold. Uses the raw datasets on the data/sources branch.
  food-data:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Raw datasets (data/sources branch)
        run: |
          git fetch --depth 1 origin data/sources
          mkdir -p "$RUNNER_TEMP/food-sources"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/food-sources"
      - name: Curated table matches its sources
        run: python3 -I scripts/foods/build_curated.py "$RUNNER_TEMP/food-sources" --check
      - name: Build + validate the full database
        run: |
          mkdir -p build
          python3 -I scripts/foods/build.py "$RUNNER_TEMP/food-sources" build/foods.ndjson build/import-report.md
          cat build/import-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Migration (twice) + import + search checks
        run: |
          set -e
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/local_stubs.sql
          $P -f supabase/migrations/20261011000000_food_database.sql
          $P -f supabase/migrations/20261011000000_food_database.sql
          python3 -I scripts/foods/import_foods.py build/foods.ndjson --sql | $P
          $P -f supabase/tests/food_search.sql 2>&1 | tee search.log
          grep -q 'food search checks passed' search.log
      - name: Apple Health ingest (migrations twice + idempotency / timezone / per-day totals / safety checks)
        run: |
          set -e
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/health_ingest_base.sql
          $P -f supabase/migrations/20261012000000_health_energy_workouts.sql
          $P -f supabase/migrations/20261012000000_health_energy_workouts.sql
          $P -f supabase/migrations/20261014000000_health_energy_samples.sql
          $P -f supabase/migrations/20261014000000_health_energy_samples.sql
          # the earlier checks must still pass with the per-day-totals functions installed
          $P -f supabase/migrations/20261016000000_health_daily_totals.sql
          $P -f supabase/migrations/20261016000000_health_daily_totals.sql
          $P -f supabase/tests/health_ingest.sql 2>&1 | tee health.log
          grep -q 'health ingest checks passed' health.log
          $P -f supabase/tests/health_samples.sql 2>&1 | tee samples.log
          grep -q 'health samples checks passed' samples.log
          $P -f supabase/tests/health_daily.sql 2>&1 | tee daily.log
          grep -q 'health daily checks passed' daily.log
      - name: Body weight (migration twice + one-per-day + owner-only RLS)
        run: |
          set -e
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/weights.sql 2>&1 | tee weights.log
          grep -q 'weight checks passed' weights.log
      - name: Calorie target (migrations twice + constraints)
        run: |
          set -e
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/calorie_range.sql 2>&1 | tee range.log
          grep -q 'calorie range checks passed' range.log
      - name: Routine schedule, activity types, energy breakdown (migration twice + constraints)
        run: |
          set -e
          P="psql -v ON_ERROR_STOP=1 -q"
          $P -f supabase/tests/routine_schedule.sql 2>&1 | tee routine.log
          grep -q 'routine schedule checks passed' routine.log
          $P -f supabase/tests/profile_weight.sql 2>&1 | tee pweight.log
          grep -q 'profile weight checks passed' pweight.log
          $P -f supabase/tests/creatine.sql 2>&1 | tee creatine.log
          grep -q 'creatine checks passed' creatine.log
          $P -f supabase/tests/favorites.sql 2>&1 | tee favorites.log
          grep -q 'favorites checks passed' favorites.log
          $P -f supabase/tests/client_errors.sql 2>&1 | tee errors.log
          grep -q 'client errors checks passed' errors.log
