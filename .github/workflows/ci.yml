# Checks every branch / pull request: unit tests, typecheck + production build,
# and the Playwright end-to-end suite (mobile + desktop). Nothing is deployed.
# Failures are also reported as annotations (the tail of the failing output),
# so they are visible on the run page without opening the logs.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log || { scripts/annotate-failure.sh 'unit tests' unit.log 'FAIL|Failed Tests'; exit 1; }

      - name: Typecheck + build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { scripts/annotate-failure.sh build build.log 'error TS|error'; exit 1; }

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee e2e.log || { scripts/annotate-failure.sh e2e e2e.log '^  [0-9]+\) '; exit 1; }
