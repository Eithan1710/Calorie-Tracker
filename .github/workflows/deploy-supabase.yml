# OPTIONAL, manual: redeploys the edge-function *code* after you change it.
# (AI keys don't need this — see sync-ai-keys.yml.)
#
# Needs the SUPABASE_ACCESS_TOKEN repository secret
# (https://supabase.com/dashboard/account/tokens). Run it from the Actions tab.
name: Deploy Supabase functions (manual)

on:
  workflow_dispatch:

# always deploy what's on main, whichever branch the run was started from

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: kjfihzskaqcboeejnkak

# contents: write only to publish the deploy log of a failed run (ci/deploy-log) — no secrets in it
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check required secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: '[ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Embed the nutrition skill into the function bundle
        run: node scripts/sync-skill.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase --version | tee deploy.log
          # all of these authenticate themselves (member session / Shortcuts token / cron secret / GitHub OIDC)
          for fn in analyze-food health-ingest send-reminders mz-config; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes 2>&1 | tee -a deploy.log
          done

      - name: Publish the deploy log (failed runs)
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p out && cp deploy.log out/ 2>/dev/null || echo "no log" > out/deploy.log
          cd out && git init -q -b ci/deploy-log && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "deploy log" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/deploy-log

      - name: Remove retired functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # mz-register (public sign-up) was retired: מאזן is members-only
          supabase functions delete mz-register --project-ref "$SUPABASE_PROJECT_REF" --yes 2>/dev/null \
            || supabase functions delete mz-register --project-ref "$SUPABASE_PROJECT_REF" || true
