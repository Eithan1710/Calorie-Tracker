# MANUAL: installs / refreshes the food database in Supabase.
#
# Run it from the Actions tab → "Install food database" → Run workflow.
# Needs the SUPABASE_ACCESS_TOKEN repository secret (the same one the function
# deploy uses). It
#   1. takes the raw open datasets from the `data/sources` branch
#      (refreshed by fetch-food-sources.yml),
#   2. proves the curated table still matches its source records,
#   3. validates and builds ~13k rows (scripts/foods/build.py),
#   4. applies supabase/migrations/20261011000000_food_database.sql (additive,
#      idempotent: new tables/functions only — no existing data is touched),
#   5. upserts the rows into mz_foods and checks a few searches.
name: Install food database (manual)

on:
  workflow_dispatch:

concurrency:
  group: food-db-import
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: kjfihzskaqcboeejnkak

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check required secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: '[ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }'

      - name: Get the raw datasets (data/sources branch)
        run: |
          git fetch --depth 1 origin data/sources
          mkdir -p "$RUNNER_TEMP/food-sources"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/food-sources"
          ls -la "$RUNNER_TEMP/food-sources"/*

      - name: Validate and build
        run: |
          set -o pipefail
          python3 -I scripts/foods/build_curated.py "$RUNNER_TEMP/food-sources" --check
          mkdir -p build
          python3 -I scripts/foods/build.py "$RUNNER_TEMP/food-sources" build/foods.ndjson build/import-report.md
          echo "::notice title=build::$(jq -c .counts build/foods.ndjson.summary.json)"
          cat build/import-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the (idempotent) food-database migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -n --rawfile q supabase/migrations/20261011000000_food_database.sql '{query: $q}' > /tmp/migration.json
          status=$(curl -sS -o /tmp/res.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/migration.json)
          head -c 600 /tmp/res.json; echo
          [ "${status:0:1}" = 2 ] || { echo "::error::migration failed (HTTP $status)"; exit 1; }

      - name: Import rows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 -I scripts/foods/import_foods.py build/foods.ndjson --api

      - name: Smoke-test search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q='select set_config($$request.jwt.claims$$, $${"role":"service_role"}$$, false);
             select string_agg(id, $$, $$) from (select id from public.mz_search_foods($$קוסקוס מבושל$$, 3, $$cooked$$)) s;'
          jq -n --arg q "$q" '{query: $q}' > /tmp/q.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json | tee /tmp/smoke.json
          grep -q 'couscous' /tmp/smoke.json || { echo "::error::search smoke test failed"; exit 1; }
