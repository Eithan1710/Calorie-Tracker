# MANUAL: applies one (idempotent, additive) migration file to the Supabase database.
#
# Actions → "Apply database migration (manual)" → Run workflow → pick the file.
# Needs the SUPABASE_ACCESS_TOKEN repository secret. The same SQL can instead be
# pasted into the Supabase SQL editor — the result is identical.
name: Apply database migration (manual)

on:
  workflow_dispatch:
    inputs:
      migration:
        description: Migration file
        type: choice
        default: 20261016000000_health_daily_totals.sql
        options:
          - 20261016000000_health_daily_totals.sql
          - 20261015000000_body_weight.sql
          - 20261014000000_health_energy_samples.sql
          - 20261012000000_health_energy_workouts.sql
          - 20261011000000_food_database.sql

concurrency:
  group: supabase-migration
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: kjfihzskaqcboeejnkak

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check required secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: '[ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }'
      - name: Apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: supabase/migrations/${{ inputs.migration }}
        run: |
          [ -f "$FILE" ] || { echo "::error::$FILE not found"; exit 1; }
          jq -n --rawfile q "$FILE" '{query: $q}' > /tmp/q.json
          status=$(curl -sS -o /tmp/res.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/q.json)
          head -c 800 /tmp/res.json; echo
          [ "${status:0:1}" = 2 ] || { echo "::error::migration failed (HTTP $status)"; exit 1; }
          echo "::notice title=migration::applied $FILE"
