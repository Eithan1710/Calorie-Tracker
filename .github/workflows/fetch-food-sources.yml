# Downloads the open food-composition sources used by the food database and
# commits the raw files to the `data/sources` branch (never to main), so the
# import can be reviewed and reproduced. Writes nothing to Supabase — loading
# the data into the app is a separate, manual step: import-food-db.yml.
#   • Tzameret — Israeli Ministry of Health national nutrient database (data.gov.il CKAN API)
#   • USDA FoodData Central — Foundation + SR Legacy bulk downloads (CC0)
#   • Open Food Facts — products sold in Israel, from the bulk CSV export (ODbL)
name: Fetch food sources

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 1 */3 *' # quarterly (Tzameret is updated quarterly at most)

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Tzameret (data.gov.il)
        run: |
          set -uo pipefail
          mkdir -p out/tzameret
          UA='CalorieTracker-data-import/1.0 (github.com/Eithan1710/Calorie-Tracker)'
          BUA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          probe() { # url ua → prints status + head of body
            code=$(curl -sS -L -A "$2" -H 'Accept: application/json' -o /tmp/body -w '%{http_code}' "$1"); echo "::notice title=probe $code::$1 → $(head -c 300 /tmp/body | tr '\n' ' ')"; [ "$code" = 200 ]
          }
          probe 'https://data.gov.il/api/3/action/package_show?id=tzameret' "$UA" && cp /tmp/body out/tzameret/package.json \
            || { probe 'https://data.gov.il/api/3/action/package_show?id=tzameret' "$BUA" && cp /tmp/body out/tzameret/package.json; } || true
          for id in c3cb0630-0650-46c1-a068-82d575c094b2 755d28c0-75f7-40e1-9c8c-ecdd106f9b2d 5c726506-5c1e-43a7-94f7-24845dbde9c3; do
            url="https://data.gov.il/api/3/action/datastore_search?resource_id=$id&limit=32000"
            if probe "$url" "$UA" || probe "$url" "$BUA"; then
              cp /tmp/body "out/tzameret/$id.json"
              echo "::notice title=resource $id::$(jq '.result.total' out/tzameret/$id.json) records; fields: $(jq -c '[.result.fields[].id]' out/tzameret/$id.json | head -c 2500)"
            fi
          done
          # the dataset slug isn't "tzameret": find the package through one of its resources
          if [ ! -f out/tzameret/package.json ]; then
            if probe 'https://data.gov.il/api/3/action/resource_show?id=c3cb0630-0650-46c1-a068-82d575c094b2' "$UA"; then
              pkg=$(jq -r '.result.package_id' /tmp/body)
              probe "https://data.gov.il/api/3/action/package_show?id=$pkg" "$UA" && cp /tmp/body out/tzameret/package.json
            fi
          fi
          # code tables (units of measure, data sources…) live as other resources of the same package
          if [ -f out/tzameret/package.json ]; then
            for id in $(jq -r '.result.resources[] | select(.datastore_active == true) | .id' out/tzameret/package.json); do
              [ -f "out/tzameret/$id.json" ] && continue
              url="https://data.gov.il/api/3/action/datastore_search?resource_id=$id&limit=32000"
              probe "$url" "$UA" && cp /tmp/body "out/tzameret/$id.json" && echo "::notice title=extra resource $id::$(jq '.result.total' out/tzameret/$id.json) records; fields $(jq -c '[.result.fields[].id]' out/tzameret/$id.json); sample $(jq -c '.result.records[:6]' out/tzameret/$id.json | head -c 1500)"
            done
          fi
          if [ -f out/tzameret/package.json ]; then
            jq '{title: .result.title, license: .result.license_title, license_id: .result.license_id, org: .result.organization.title, modified: .result.metadata_modified, resources: [.result.resources[] | {id, name, format, last_modified, datastore_active}]}' out/tzameret/package.json > out/tzameret/meta.json || true
            echo "::notice title=tzameret meta::$(tr '\n' ' ' < out/tzameret/meta.json | head -c 3000)"
          fi
          ls -la out/tzameret
      - name: Open Food Facts — Israel coverage
        run: |
          set -uo pipefail
          mkdir -p out/off
          UA='CalorieTracker/1.0 (eithan11710@gmail.com)'
          probe() { code=$(curl -sS -L -A "$UA" -o "$2" -w '%{http_code}' "$1"); echo "::notice title=OFF $code::$1 → $(head -c 200 "$2" | tr '\n' ' ')"; }
          probe 'https://world.openfoodfacts.org/api/v2/search?countries_tags_en=israel&page_size=1&fields=code' out/off/israel_count.json
          sleep 7
          probe 'https://world.openfoodfacts.org/api/v2/search?countries_tags_en=israel&page_size=100&sort_by=unique_scans_n&fields=code,product_name,product_name_he,brands,quantity,nutriments,nutrition_data_per,completeness' out/off/israel_top100.json
          sleep 7
          probe 'https://world.openfoodfacts.org/api/v2/product/7290000066318?fields=code,product_name,product_name_he,brands,nutriments' out/off/sample_product.json
          echo "::notice title=OFF Israel count::$(jq '.count' out/off/israel_count.json 2>/dev/null)"
          echo "::notice title=OFF top sample::$(jq -c '[.products[:20][] | {code, n: (.product_name_he // .product_name), b: .brands, kcal: .nutriments["energy-kcal_100g"], p: .nutriments.proteins_100g}]' out/off/israel_top100.json 2>/dev/null | head -c 3500)"
          # data dumps (preferred by OFF for bulk use) — size only
          curl -sSI -A "$UA" https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz | grep -i '^content-length' | sed 's/^/::notice title=OFF dump size::/' || true
      - name: USDA FoodData Central — Foundation + SR Legacy (CC0)
        run: |
          set -euo pipefail
          mkdir -p out/usda && cd out/usda
          # current releases (the download page is JS-rendered, so links are pinned; update when USDA publishes new ones)
          for url in https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_foundation_food_json_2026-04-30.zip \
                     https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_sr_legacy_food_json_2018-04.zip; do
            echo "::notice title=USDA download::$url"
            for try in 1 2 3; do curl -sSLf --retry 3 "$url" -o d.zip && break; sleep 10; done
            unzip -o -q d.zip && rm -f d.zip
          done
          rm -f *.zip
          # keep a compact subset: per-100 g macros + fibre/sugar/sodium/sat-fat + portions
          ls -la
          python3 - 2>/tmp/usda_err <<'PY' || { echo "::error title=USDA compact failed::$(tail -c 2000 /tmp/usda_err | tr '\n' ' ')"; exit 1; }
          import glob, gzip, json
          N = {1008: 'kcal', 2047: 'kcal_atw_gen', 2048: 'kcal_atw_spec', 1003: 'protein', 1004: 'fat', 1005: 'carbs', 1050: 'carbs_sum',
               1079: 'fiber', 2000: 'sugar', 1063: 'sugar_nlea', 1093: 'sodium', 1258: 'sat_fat', 1051: 'water', 1018: 'alcohol'}
          n = 0
          with gzip.open('foods.jsonl.gz', 'wt', encoding='utf-8') as out:
              for path in glob.glob('*.json'):
                  d = json.load(open(path)); key = list(d)[0]
                  for f in d[key]:
                      if not isinstance(f, dict): continue
                      nut = {}
                      for fn in (f.get('foodNutrients') or []):
                          if not isinstance(fn, dict): continue
                          nid = (fn.get('nutrient') or {}).get('id') if isinstance(fn.get('nutrient'), dict) else fn.get('nutrientId')
                          if nid in N and fn.get('amount') is not None and N[nid] not in nut:
                              nut[N[nid]] = fn['amount']
                      portions = [{'g': p.get('gramWeight'), 'amount': p.get('amount'), 'unit': (p.get('measureUnit') or {}).get('name'),
                                   'desc': p.get('portionDescription') or p.get('modifier')} for p in (f.get('foodPortions') or []) if isinstance(p, dict) and p.get('gramWeight')]
                      out.write(json.dumps({'fdcId': f['fdcId'], 'dataset': key, 'description': f['description'],
                                            'category': (f.get('foodCategory') or {}).get('description') if isinstance(f.get('foodCategory'), dict) else f.get('foodCategory'),
                                            'published': f.get('publicationDate'), 'nutrients': nut, 'portions': portions[:8]}) + '\n')
                      n += 1
          print(f'::notice title=USDA compact::{n} foods')
          PY
          rm -f *.json
          ls -la
      - name: Open Food Facts — products sold in Israel (bulk CSV export, ODbL)
        run: |
          set -euo pipefail
          mkdir -p out/off
          curl -sSLf -A 'CalorieTracker/1.0 (eithan11710@gmail.com)' https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz -o /tmp/off.csv.gz
          ls -la /tmp/off.csv.gz
          python3 - <<'PY'
          import csv, gzip, json, sys
          csv.field_size_limit(sys.maxsize)
          keep = ['code','product_name','generic_name','brands','quantity','serving_size','serving_quantity','categories_tags','countries_tags','lang','last_modified_t','completeness','nutrition_data_per','energy-kcal_100g','energy_100g','proteins_100g','fat_100g','saturated-fat_100g','carbohydrates_100g','sugars_100g','fiber_100g','sodium_100g','salt_100g','states_tags']
          n = kept = 0
          with gzip.open('/tmp/off.csv.gz', 'rt', encoding='utf-8', errors='replace', newline='') as f, gzip.open('out/off/israel_products.jsonl.gz', 'wt', encoding='utf-8') as out:
              r = csv.DictReader(f, delimiter='\t')
              missing = [k for k in keep if k not in r.fieldnames]
              print('::notice title=OFF columns missing::' + ','.join(missing))
              for row in r:
                  n += 1
                  if 'en:israel' not in (row.get('countries_tags') or ''): continue
                  kept += 1
                  out.write(json.dumps({k: row.get(k) for k in keep if k in row}, ensure_ascii=False) + '\n')
          print(f'::notice title=OFF Israel subset::{kept} of {n} products')
          PY
          ls -la out/off
      - name: Commit raw files to data/sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin data/sources || true
          git switch --orphan data/sources
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name out -exec rm -rf {} +
          mv out/* . && rmdir out
          echo "::notice title=committing::$(du -ah . --exclude=.git | sort -h | tail -12 | tr '\n' ' ')"
          printf '# Raw food-composition source files\n\nFetched by .github/workflows/fetch-food-sources.yml on %s.\n' "$(date -u +%F)" > README.md
          git add -A
          git commit -qm "Raw food sources $(date -u +%F)"
          git push -f origin data/sources
