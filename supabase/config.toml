# Minimal Supabase CLI config for this project (run `supabase init` merges defaults).
project_id = "kjfihzskaqcboeejnkak"

[auth]
site_url = "https://eithan1710.github.io/Calorie-Tracker/"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = true
# מאזן accounts are username + password. Usernames map to synthetic addresses
# (u<hash>@users.maazan.app, see functions/_shared/account.ts) that are created
# already-confirmed by the mz-register function, so no email is ever sent.

[functions.analyze-food]
import_map = "./functions/deno.json"
verify_jwt = false   # checks the user's session itself (and refuses anonymous sessions)

[functions.mz-register]
import_map = "./functions/deno.json"
verify_jwt = false   # public sign-up endpoint (validates input, rate-limited)

[functions.health-ingest]
import_map = "./functions/deno.json"
verify_jwt = false   # authenticated with the personal Shortcuts token

[functions.send-reminders]
import_map = "./functions/deno.json"
verify_jwt = false   # authenticated with x-cron-secret

[functions.mz-config]
import_map = "./functions/deno.json"
verify_jwt = false   # authenticated with the GitHub Actions OIDC token
