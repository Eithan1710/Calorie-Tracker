# Minimal Supabase CLI config for this project (run `supabase init` merges defaults).
project_id = "kjfihzskaqcboeejnkak"

[auth]
site_url = "https://eithan1710.github.io/Calorie-Tracker/"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
# Shared Auth project (another app signs users up), so sign-up stays enabled at
# project level. מאזן itself is closed: only accounts in public.mz_members can
# use it (enforced by RLS, Storage policies and the analyze-food function).
# Members are created in the SQL editor with public.mz_create_member().
enable_signup = true

[functions.analyze-food]
import_map = "./functions/deno.json"
verify_jwt = false   # checks the session itself: members only, never anonymous

[functions.health-ingest]
import_map = "./functions/deno.json"
verify_jwt = false   # authenticated with the personal Shortcuts token

[functions.send-reminders]
import_map = "./functions/deno.json"
verify_jwt = false   # authenticated with x-cron-secret

[functions.mz-config]
import_map = "./functions/deno.json"
verify_jwt = false   # authenticated with the GitHub Actions OIDC token
