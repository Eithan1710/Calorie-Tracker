<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>הדף לא נמצא · מאזן</title>
    <link rel="icon" href="/Calorie-Tracker/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f5f3ee; --ink: #17181b; --ink2: #4a4c52; --surface: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d0e10; --ink: #f2f2f3; --ink2: #a9abb2; --surface: #1a1b1f; } }
      html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Rubik, Arial, sans-serif; }
      main { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
      .card { max-width: 420px; width: 100%; background: var(--surface); border-radius: 28px; padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgb(0 0 0 / 0.06); }
      img { width: 64px; height: 64px; }
      h1 { font-size: 26px; margin: 16px 0 8px; }
      p { color: var(--ink2); margin: 0 0 24px; line-height: 1.5; }
      a { display: block; min-height: 48px; line-height: 48px; border-radius: 16px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="/Calorie-Tracker/favicon.svg" alt="" />
        <h1>הדף הזה לא קיים</h1>
        <p>ייתכן שהקישור ישן או שנפלה בו טעות.</p>
        <a href="/Calorie-Tracker/">חזרה למאזן</a>
      </div>
    </main>
  </body>
</html>
